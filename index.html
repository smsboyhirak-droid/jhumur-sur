<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ঝুমুর সুর</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#06140b;
  color:white;
  padding-bottom:125px;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:#071b0e;
  border-bottom:1px solid #c9a347;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.logo span{
  color:#d9ad4b;
}

.menu{
  font-size:25px;
  color:#d9ad4b;
}

.hero{
  min-height:480px;
  padding:70px 22px;
  display:flex;
  align-items:center;

  background:
  linear-gradient(
    90deg,
    rgba(2,15,7,.95),
    rgba(3,35,16,.65),
    rgba(0,0,0,.35)
  ),
  url("https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1600&q=85")
  center/cover;
}

.hero-content{
  max-width:650px;
}

.hero small{
  color:#d9ad4b;
  letter-spacing:2px;
  font-size:10px;
}

.hero h1{
  margin-top:18px;
  font-family:Georgia,"Noto Serif Bengali",serif;
  font-size:48px;
  line-height:1.2;
}

.hero h1 span{
  color:#d9ad4b;
}

.hero p{
  margin-top:20px;
  color:#c5d0c8;
  line-height:1.8;
  font-size:15px;
}

.hero button{
  margin-top:25px;
  padding:14px 25px;
  border:0;
  border-radius:30px;
  background:#d9ad4b;
  color:#111;
  font-weight:bold;
  font-size:15px;
}

.section{
  max-width:900px;
  margin:auto;
  padding:45px 15px;
}

.label{
  color:#d9ad4b;
  font-size:10px;
  letter-spacing:2px;
}

h2{
  margin-top:8px;
  font-size:32px;
  font-family:Georgia,"Noto Serif Bengali",serif;
}

h2 span{
  color:#d9ad4b;
}

.song{
  margin-top:13px;
  padding:13px;
  border-radius:17px;
  background:linear-gradient(120deg,#17381f,#0b1c10);
  border:1px solid rgba(217,173,75,.25);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.song.active{
  border-color:#d9ad4b;
}

.song-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.number{
  width:25px;
  color:#738479;
  font-size:11px;
}

.album{
  width:52px;
  height:52px;
  border-radius:13px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(145deg,#477b50,#102316);
  color:#d9ad4b;
  font-size:23px;
  flex-shrink:0;
}

.info{
  min-width:0;
}

.info h3{
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.info p{
  margin-top:4px;
  color:#849288;
  font-size:10px;
}

.song button{
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  background:#d9ad4b;
  color:#111;
  font-size:16px;
  flex-shrink:0;
}

.player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:50;
  padding:12px 14px 15px;
  background:#06170c;
  border-top:1px solid #c9a347;
  box-shadow:0 -8px 30px rgba(0,0,0,.5);
}

.player-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.player-art{
  width:48px;
  height:48px;
  border-radius:12px;
  background:linear-gradient(145deg,#477b50,#102316);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#d9ad4b;
  font-size:21px;
  flex-shrink:0;
}

.player-info{
  flex:1;
  min-width:0;
}

.player-title{
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player-sub{
  margin-top:3px;
  font-size:10px;
  color:#819086;
}

.controls{
  display:flex;
  gap:4px;
}

.control{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  font-size:15px;
}

.play,
.next{
  background:#d9ad4b;
  color:#111;
}

.stop{
  background:#17291c;
  color:#d9ad4b;
  border:1px solid #80652f;
}

.progress-box{
  margin-top:8px;
}

#progress{
  width:100%;
  height:5px;
  accent-color:#d9ad4b;
}

.time{
  display:flex;
  justify-content:space-between;
  color:#738178;
  font-size:9px;
}

@media(max-width:600px){

  .hero{
    min-height:500px;
  }

  .hero h1{
    font-size:40px;
  }

  .hero p{
    font-size:14px;
  }

  .control{
    width:36px;
    height:36px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    ঝুমুর <span>সুর</span>
  </div>

  <div class="menu">☰</div>
</header>


<section class="hero">

  <div class="hero-content">

    <small>
      JHUMUR • PURULIA • JHARGRAM • KURMALI
    </small>

    <h1>
      মাটির গন্ধে,<br>
      <span>ঝুমুরের সুরে।</span>
    </h1>

    <p>
      পুরুলিয়া ও ঝাড়গ্রামের মাটি,
      অরণ্য আর লোকসংস্কৃতির ঝুমুর গান
      এক জায়গায়।
    </p>

    <button onclick="playSong(0)">
      ▶ গান শুনুন
    </button>

  </div>

</section>


<section class="section">

  <div class="label">
    FOLK MUSIC COLLECTION
  </div>

  <h2>
    ঝুমুর <span>গান</span>
  </h2>

  <div id="songList"></div>

</section>


<div class="player">

  <div class="player-top">

    <div class="player-art">
      ♪
    </div>

    <div class="player-info">

      <div class="player-title" id="playerTitle">
        কোনো গান চলছে না
      </div>

      <div class="player-sub" id="playerSub">
        গান নির্বাচন করুন
      </div>

    </div>

    <div class="controls">

      <button
        class="control play"
        id="playBtn"
        onclick="togglePlay()">
        ▶
      </button>

      <button
        class="control next"
        onclick="nextSong()">
        ⏭
      </button>

      <button
        class="control stop"
        onclick="stopSong()">
        ⏹
      </button>

    </div>

  </div>


  <div class="progress-box">

    <input
      id="progress"
      type="range"
      min="0"
      max="100"
      value="0">

    <div class="time">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>

  </div>

</div>


<audio id="audio" preload="metadata"></audio>


<script>

/* =====================================
   তোমার ১৪টা গান
   IMPORTANT:
   সব MP3 index.html-এর একই folder-এ আছে
===================================== */

const songs = [

  {
    title:"ঝুমুর গান ১",
    subtitle:"লোকসংগীত • ঝুমুর",
    file:"song1.mp3"
  },

  {
    title:"ঝুমুর গান ২",
    subtitle:"লোকসংগীত • ঝুমুর",
    file:"song2.mp3"
  },

  {
    title:"ঝুমুর গান ৩",
    subtitle:"লোকসংগীত • ঝুমুর",
    file:"song3.mp3"
  },

  {
    title:"ঝুমুর গান ৪",
    subtitle:"লোকসংগীত • ঝুমুর",
    file:"song4.mp3"
  },

  {
    title:"ঝুমুর গান ৫",
    subtitle:"লোকসংগীত • ঝুমুর",
    file:"song5.mp3"
  },

  {
    title:"ঝুমুর গান ৬",
    subtitle:"লোকসংগীত • ঝুমুর",
    file:"song6.mp3"
  },

  {
    title:"ঝুমুর গান ৭",
    subtitle:"লোকসংগীত • ঝুমুর",
    file:"song7.mp3"
  },

  {
    title:"ঝুমুর গান ৮",
    subtitle:"লোকসংগীত • ঝুমুর",
    file:"song8.mp3"
  },

  {
    title:"ঝুমুর গান ৯",
    subtitle:"লোকসংগীত • ঝুমুর",
    file:"song9.mp3"
  },

  {
    title:"ঝুমুর গান ১০",
    subtitle:"লোকসংগীত • ঝুমুর",
    file:"song10.mp3"
  },

  {
    title:"ঝুমুর গান ১১",
    subtitle:"লোকসংগীত • ঝুমুর",
    file:"song11.mp3"
  },

  {
    title:"ঝুমুর গান ১২",
    subtitle:"লোকসংগীত • ঝুমুর",
    file:"song12.mp3"
  },

  {
    title:"ঝুমুর গান ১৩",
    subtitle:"লোকসংগীত • ঝুমুর",
    file:"song13.mp3"
  },

  {
    title:"ঝুমুর গান ১৪",
    subtitle:"লোকসংগীত • ঝুমুর",
    file:"song14.mp3"
  }

];


let currentSong = 0;

const audio = document.getElementById("audio");
const songList = document.getElementById("songList");
const playerTitle = document.getElementById("playerTitle");
const playerSub = document.getElementById("playerSub");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");


/* গানগুলোর তালিকা তৈরি */

function showSongs(){

  songList.innerHTML = "";

  songs.forEach(function(song,index){

    const div = document.createElement("div");

    div.className = "song";
    div.id = "song-" + index;

    div.innerHTML = `

      <div class="song-left">

        <div class="number">
          ${String(index+1).padStart(2,"0")}
        </div>

        <div class="album">
          ♪
        </div>

        <div class="info">

          <h3>
            ${song.title}
          </h3>

          <p>
            ${song.subtitle}
          </p>

        </div>

      </div>

      <button onclick="playSong(${index})">
        ▶
      </button>

    `;

    songList.appendChild(div);

  });

}


/* গান চালানো */

function playSong(index){

  if(index < 0 || index >= songs.length){
    return;
  }

  currentSong = index;

  const song = songs[index];

  audio.src = song.file;

  playerTitle.textContent = song.title;
  playerSub.textContent = song.subtitle;

  document.querySelectorAll(".song")
    .forEach(function(item){
      item.classList.remove("active");
    });

  const active =
    document.getElementById("song-" + index);

  if(active){
    active.classList.add("active");
  }

  audio.load();

  audio.play()
    .then(function(){

      playBtn.textContent = "⏸";

    })
    .catch(function(error){

      console.log(error);

      playBtn.textContent = "▶";

      playerSub.textContent =
        "গান চালানো যাচ্ছে না";

    });

}


/* Play / Pause */

function togglePlay(){

  if(!audio.src){

    playSong(0);
    return;

  }

  if(audio.paused){

    audio.play()
      .then(function(){

        playBtn.textContent = "⏸";

      })
      .catch(function(){

        playerSub.textContent =
          "গান চালানো যাচ্ছে না";

      });

  }else{

    audio.pause();

    playBtn.textContent = "▶";

  }

}


/* Stop */

function stopSong(){

  audio.pause();

  audio.currentTime = 0;

  playBtn.textContent = "▶";

  progress.value = 0;

  currentTime.textContent = "0:00";

  playerSub.textContent =
    "গান বন্ধ করা হয়েছে";

}


/* Next */

function nextSong(){

  currentSong++;

  if(currentSong >= songs.length){

    currentSong = 0;

  }

  playSong(currentSong);

}


/* গান শেষ হলে নিজে নিজে পরের গান */

audio.addEventListener("ended",function(){

  nextSong();

});


/* গান চলার সময় progress */

audio.addEventListener("timeupdate",function(){

  if(audio.duration){

    progress.value =
      (audio.currentTime / audio.duration) * 100;

  }

  currentTime.textContent =
    formatTime(audio.currentTime);

});


/* Duration */

audio.addEventListener("loadedmetadata",function(){

  duration.textContent =
    formatTime(audio.duration);

});


/* Progress থেকে গান এগিয়ে নেওয়া */

progress.addEventListener("input",function(){

  if(audio.duration){

    audio.currentTime =
      (progress.value / 100) * audio.duration;

  }

});


/* সময় format */

function formatTime(seconds){

  if(!isFinite(seconds)){
    return "0:00";
  }

  const min =
    Math.floor(seconds / 60);

  const sec =
    Math.floor(seconds % 60);

  return min + ":" +
    String(sec).padStart(2,"0");

}


/* Error */

audio.addEventListener("error",function(){

  playBtn.textContent = "▶";

  playerSub.textContent =
    "MP3 ফাইল পাওয়া যাচ্ছে না";

});


/* শুরু */

showSongs();

</script>

</body>
</html>
