<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ঝুমুর সুর</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#070707;
  color:#fff;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  min-height:100vh;
}

.app{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:25px 22px 35px;
}

/* HEADER */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{
  color:#f2a91f;
  font-size:30px;
  font-weight:bold;
}

.tagline{
  color:#aaa;
  font-size:14px;
  margin-top:5px;
}

.online{
  color:#ddd;
  font-size:14px;
}

.online span{
  color:#f2a91f;
}

/* COVER */

.cover{
  width:100%;
  aspect-ratio:16/11;
  border-radius:25px;
  overflow:hidden;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.05),
      rgba(0,0,0,.25)
    ),
    url("jhumur-cover.png") center/cover;

  border:1px solid #5b4217;

  box-shadow:
    0 25px 80px rgba(0,0,0,.8);
}

/* SONG INFO */

.song-info{
  text-align:center;
  margin-top:25px;
}

.song-info h1{
  font-family:Georgia,"Noto Serif Bengali",serif;
  font-size:42px;
  color:#f5eee2;
}

.song-info p{
  color:#f2a91f;
  font-size:19px;
  margin-top:8px;
}

.favorite{
  margin-top:15px;
  border:0;
  background:none;
  color:#eee;
  font-size:32px;
  cursor:pointer;
}

.favorite.active{
  color:#f2a91f;
}

/* PROGRESS */

.progress-box{
  margin-top:20px;
}

.times{
  display:flex;
  justify-content:space-between;
  color:#aaa;
  font-size:13px;
  margin-bottom:8px;
}

input[type="range"]{
  width:100%;
  accent-color:#f2a91f;
  cursor:pointer;
}

/* CONTROLS */

.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:55px;
  margin-top:30px;
}

.control{
  background:none;
  border:0;
  color:#eee;
  font-size:32px;
  cursor:pointer;
}

.control:hover{
  color:#f2a91f;
}

.play{
  width:85px;
  height:85px;
  border-radius:50%;

  border:2px solid #f2a91f;
  background:#111;

  color:#f2a91f;
  font-size:30px;

  cursor:pointer;
}

.play:hover{
  background:#f2a91f;
  color:#111;
}

/* VOLUME */

.volume{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  margin-top:35px;
}

.volume span{
  font-size:25px;
}

/* DECORATION */

.line{
  height:1px;
  background:#5c4217;
  margin:45px 0 25px;
  position:relative;
}

.line:after{
  content:"✿";
  position:absolute;
  left:50%;
  top:-14px;
  transform:translateX(-50%);
  background:#070707;
  padding:0 18px;
  color:#f2a91f;
  font-size:22px;
}

/* FOOTER */

footer{
  text-align:center;
  color:#aaa;
  font-size:14px;
}

footer b{
  color:#f2a91f;
}

/* MOBILE */

@media(max-width:600px){

  .app{
    padding:18px 14px 30px;
  }

  .logo{
    font-size:24px;
  }

  .tagline{
    font-size:11px;
  }

  .online{
    font-size:12px;
  }

  .cover{
    aspect-ratio:1/1;
    border-radius:20px;
  }

  .song-info h1{
    font-size:32px;
  }

  .song-info p{
    font-size:16px;
  }

  .controls{
    gap:25px;
  }

  .control{
    font-size:25px;
  }

  .play{
    width:70px;
    height:70px;
    font-size:25px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <div>
    <div class="logo">♫ ঝুমুর সুর</div>
    <div class="tagline">
      মাটির গন্ধ, বাংলার সুর
    </div>
  </div>

  <div class="online">
    👥 <span id="online">12</span> জন শুনছেন
  </div>

</header>


<!-- GRAM BANGLAR JHUMUR PHOTO -->

<div class="cover"></div>


<!-- SONG -->

<div class="song-info">

  <h1 id="songTitle">
    মাটির টানে
  </h1>

  <p>
    ঝুমুর গান
  </p>

  <button
    class="favorite"
    id="favorite"
    onclick="favorite()">
    ♡
  </button>

</div>


<!-- PROGRESS -->

<div class="progress-box">

  <div class="times">

    <span id="currentTime">
      0:00
    </span>

    <span id="duration">
      0:00
    </span>

  </div>

  <input
    type="range"
    id="progress"
    min="0"
    max="100"
    value="0"
  >

</div>


<!-- CONTROLS -->

<div class="controls">

  <button
    class="control"
    onclick="shuffle()">
    🔀
  </button>

  <button
    class="control"
    onclick="previous()">
    ⏮
  </button>

  <button
    class="play"
    id="playButton"
    onclick="togglePlay()">
    ▶
  </button>

  <button
    class="control"
    onclick="next()">
    ⏭
  </button>

  <button
    class="control"
    id="repeatButton"
    onclick="repeat()">
    🔁
  </button>

</div>


<!-- VOLUME -->

<div class="volume">

  <span>🔊</span>

  <input
    type="range"
    id="volume"
    min="0"
    max="1"
    step="0.01"
    value=".8"
  >

</div>


<div class="line"></div>


<footer>

  Made with ❤️ for Bengali Folk Music
  <br><br>

  <b>Made by HirakMahata</b>

</footer>

</div>


<audio id="audio"></audio>


<script>

const songs = [
  "song1.mp3",
  "song2.mp3",
  "song3.mp3",
  "song4.mp3",
  "song5.mp3",
  "song6.mp3",
  "song7.mp3",
  "song8.mp3",
  "song9.mp3",
  "song10.mp3",
  "song11.mp3",
  "song12.mp3",
  "song13.mp3",
  "song14.mp3"
];

let currentSong = 0;
let repeatMode = false;

const audio =
document.getElementById("audio");

const playButton =
document.getElementById("playButton");

const progress =
document.getElementById("progress");

const currentTime =
document.getElementById("currentTime");

const duration =
document.getElementById("duration");

const volume =
document.getElementById("volume");

function formatTime(seconds){

  if(!Number.isFinite(seconds))
    return "0:00";

  const min =
  Math.floor(seconds / 60);

  const sec =
  Math.floor(seconds % 60)
  .toString()
  .padStart(2,"0");

  return min + ":" + sec;
}


function loadSong(){

  audio.src =
  songs[currentSong];

  progress.value = 0;

  currentTime.textContent =
  "0:00";

  duration.textContent =
  "0:00";

  audio.load();
}


function playSong(){

  audio.play()
  .then(()=>{
    playButton.textContent = "❚❚";
  })
  .catch(()=>{
    playButton.textContent = "▶";
  });
}


function pauseSong(){

  audio.pause();

  playButton.textContent =
  "▶";
}


function togglePlay(){

  if(audio.paused)
    playSong();
  else
    pauseSong();

}


function next(){

  currentSong++;

  if(currentSong >= songs.length)
    currentSong = 0;

  loadSong();
  playSong();
}


function previous(){

  currentSong--;

  if(currentSong < 0)
    currentSong = songs.length - 1;

  loadSong();
  playSong();
}


function shuffle(){

  let random;

  do{
    random =
    Math.floor(
      Math.random() * songs.length
    );
  }
  while(
    random === currentSong &&
    songs.length > 1
  );

  currentSong = random;

  loadSong();
  playSong();
}


function repeat(){

  repeatMode =
  !repeatMode;

  document
  .getElementById("repeatButton")
  .style.color =
  repeatMode
  ? "#f2a91f"
  : "#eee";
}


function favorite(){

  const heart =
  document.getElementById("favorite");

  heart.classList.toggle("active");

  heart.textContent =
  heart.classList.contains("active")
  ? "♥"
  : "♡";
}


audio.addEventListener(
"loadedmetadata",
()=>{

  duration.textContent =
  formatTime(audio.duration);

});


audio.addEventListener(
"timeupdate",
()=>{

  currentTime.textContent =
  formatTime(audio.currentTime);

  if(audio.duration){

    progress.value =
    (audio.currentTime /
    audio.duration) * 100;

  }

});


progress.addEventListener(
"input",
()=>{

  if(audio.duration){

    audio.currentTime =
    (progress.value / 100)
    * audio.duration;

  }

});


volume.addEventListener(
"input",
()=>{

  audio.volume =
  volume.value;

});


audio.addEventListener(
"ended",
()=>{

  if(repeatMode){

    audio.currentTime = 0;

    playSong();

  }else{

    next();

  }

});


audio.volume = .8;

loadSong();

</script>

</body>
</html>
