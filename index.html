<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ঝুমুর সুর 🎵</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, "Noto Sans Bengali", sans-serif;
  background: #0f172a;
  color: white;
  min-height: 100vh;
  padding-bottom: 150px;
}

header {
  background: #111827;
  padding: 18px;
  text-align: center;
  border-bottom: 1px solid #334155;
  position: sticky;
  top: 0;
  z-index: 10;
}

header h1 {
  font-size: 25px;
  color: #fbbf24;
}

header p {
  margin-top: 5px;
  color: #cbd5e1;
  font-size: 14px;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 20px 15px;
}

.welcome {
  text-align: center;
  padding: 25px 10px;
}

.welcome h2 {
  font-size: 28px;
  margin-bottom: 8px;
}

.welcome p {
  color: #cbd5e1;
}

.song-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.song {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: 0.2s;
}

.song:hover {
  background: #273449;
}

.song.active {
  border-color: #fbbf24;
  background: #292b32;
}

.song-number {
  width: 40px;
  height: 40px;
  background: #fbbf24;
  color: #111827;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.song-info {
  flex: 1;
}

.song-info h3 {
  font-size: 16px;
}

.song-info p {
  font-size: 12px;
  color: #94a3b8;
  margin-top: 4px;
}

.play-small {
  font-size: 22px;
}

.player {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #111827;
  border-top: 1px solid #334155;
  padding: 15px;
  z-index: 20;
}

.player-inner {
  max-width: 650px;
  margin: auto;
}

.now-playing {
  text-align: center;
  color: #fbbf24;
  font-weight: bold;
  margin-bottom: 10px;
}

.progress-area {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: #94a3b8;
}

input[type="range"] {
  flex: 1;
  accent-color: #fbbf24;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 22px;
  margin-top: 10px;
}

.controls button {
  border: none;
  background: #334155;
  color: white;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  font-size: 19px;
  cursor: pointer;
}

.controls .main-btn {
  width: 55px;
  height: 55px;
  background: #fbbf24;
  color: #111827;
  font-size: 23px;
}

.volume {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.volume span {
  font-size: 14px;
}

@media (max-width: 400px) {
  .controls {
    gap: 14px;
  }

  header h1 {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎵 ঝুমুর সুর</h1>
  <p>আপনার পছন্দের গান শুনুন</p>
</header>

<div class="container">

  <div class="welcome">
    <h2>🎶 গানসমূহ</h2>
    <p>নিচের যেকোনো গান নির্বাচন করুন</p>
  </div>

  <div class="song-list" id="songList"></div>

</div>

<div class="player">

  <div class="player-inner">

    <div class="now-playing" id="nowPlaying">
      কোনো গান নির্বাচন করা হয়নি
    </div>

    <div class="progress-area">
      <span id="currentTime">0:00</span>

      <input
        type="range"
        id="progress"
        min="0"
        max="100"
        value="0"
      >

      <span id="duration">0:00</span>
    </div>

    <div class="controls">

      <button onclick="previousSong()">⏮</button>

      <button
        class="main-btn"
        id="playBtn"
        onclick="togglePlay()"
      >
        ▶
      </button>

      <button onclick="nextSong()">⏭</button>

    </div>

    <div class="volume">
      <span>🔊</span>

      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="1"
      >
    </div>

  </div>

</div>

<audio id="audio"></audio>

<script>

const songs = [
  "song1.mp3",
  "song2.mp3",
  "song3.mp3",
  "song4.mp3",
  "song5.mp3",
  "song6.mp3",
  "song7.mp3",
  "song8.mp3",
  "song9.mp3",
  "song10.mp3",
  "song11.mp3",
  "song12.mp3",
  "song13.mp3",
  "song14.mp3"
];

const songList = document.getElementById("songList");
const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const nowPlaying = document.getElementById("nowPlaying");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");

let currentSong = 0;

function createSongList() {

  songList.innerHTML = "";

  songs.forEach((song, index) => {

    const div = document.createElement("div");

    div.className = "song";

    div.innerHTML = `
      <div class="song-number">${index + 1}</div>

      <div class="song-info">
        <h3>গান ${index + 1}</h3>
        <p>${song}</p>
      </div>

      <div class="play-small">▶</div>
    `;

    div.onclick = () => {
      loadSong(index);
      playSong();
    };

    songList.appendChild(div);

  });

}

function loadSong(index) {

  currentSong = index;

  audio.src = songs[currentSong];

  nowPlaying.innerText =
    "🎵 এখন চলছে: গান " + (currentSong + 1);

  document.querySelectorAll(".song").forEach((song, i) => {

    song.classList.toggle(
      "active",
      i === currentSong
    );

  });

}

function playSong() {

  audio.play();

  playBtn.innerText = "⏸";

}

function pauseSong() {

  audio.pause();

  playBtn.innerText = "▶";

}

function togglePlay() {

  if (!audio.src) {

    loadSong(0);

  }

  if (audio.paused) {

    playSong();

  } else {

    pauseSong();

  }

}

function previousSong() {

  currentSong--;

  if (currentSong < 0) {
    currentSong = songs.length - 1;
  }

  loadSong(currentSong);
  playSong();

}

function nextSong() {

  currentSong++;

  if (currentSong >= songs.length) {
    currentSong = 0;
  }

  loadSong(currentSong);
  playSong();

}

function formatTime(seconds) {

  if (isNaN(seconds)) {
    return "0:00";
  }

  const minutes = Math.floor(seconds / 60);

  const secs = Math.floor(seconds % 60)
    .toString()
    .padStart(2, "0");

  return minutes + ":" + secs;

}

audio.addEventListener("loadedmetadata", () => {

  duration.innerText =
    formatTime(audio.duration);

});

audio.addEventListener("timeupdate", () => {

  if (audio.duration) {

    progress.value =
      (audio.currentTime / audio.duration) * 100;

  }

  currentTime.innerText =
    formatTime(audio.currentTime);

});

progress.addEventListener("input", () => {

  if (audio.duration) {

    audio.currentTime =
      (progress.value / 100) * audio.duration;

  }

});

volume.addEventListener("input", () => {

  audio.volume = volume.value;

});

audio.addEventListener("play", () => {

  playBtn.innerText = "⏸";

});

audio.addEventListener("pause", () => {

  playBtn.innerText = "▶";

});

audio.addEventListener("ended", () => {

  nextSong();

});

createSongList();

</script>

</body>
</html>
