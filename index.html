<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ঝুমুর সুর</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#080808;
  color:#fff;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* MAIN */

.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  padding:28px 22px 25px;

  display:flex;
  flex-direction:column;
  align-items:center;
}

/* TOP */

.top{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
}

.logo{
  color:#f4b62c;
  font-size:22px;
  font-weight:bold;
  letter-spacing:.5px;
}

.online{
  color:#9b9b9b;
  font-size:14px;
}

.online span{
  color:#f4b62c;
}

/* ARTWORK */

.artwork{
  width:min(82vw,430px);
  aspect-ratio:1/1;

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      rgba(0,0,0,.05),
      rgba(0,0,0,.3)
    ),
    url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=85")
    center/cover;

  box-shadow:
    0 25px 70px rgba(0,0,0,.75),
    0 0 0 1px rgba(255,255,255,.05);

  position:relative;
  overflow:hidden;
}

.artwork:after{
  content:"♫";
  position:absolute;
  bottom:20px;
  right:22px;

  width:48px;
  height:48px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);

  color:#f4b62c;
  font-size:25px;
}

/* SONG INFO */

.info{
  width:min(82vw,430px);
  margin-top:22px;
}

.song-name{
  font-size:25px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist{
  margin-top:7px;
  color:#929292;
  font-size:15px;
}

/* PROGRESS */

.progress-area{
  width:min(82vw,430px);
  margin-top:25px;
}

.time{
  display:flex;
  justify-content:space-between;
  color:#777;
  font-size:12px;
  margin-bottom:8px;
}

#progress{
  width:100%;
  height:4px;
  accent-color:#f4b62c;
  cursor:pointer;
}

/* CONTROLS */

.controls{
  width:min(82vw,430px);

  display:flex;
  justify-content:center;
  align-items:center;

  gap:28px;
  margin-top:25px;
}

.control{
  border:none;
  background:none;
  color:#ddd;
  font-size:22px;
  cursor:pointer;

  transition:.2s;
}

.control:hover{
  color:#f4b62c;
  transform:scale(1.1);
}

.play{
  width:65px;
  height:65px;

  border:none;
  border-radius:50%;

  background:#f4b62c;
  color:#080808;

  font-size:25px;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:0 10px 35px rgba(244,182,44,.2);

  transition:.2s;
}

.play:hover{
  transform:scale(1.06);
}

/* BOTTOM */

.bottom{
  width:min(82vw,430px);

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-top:28px;
}

.bottom button{
  border:none;
  background:none;
  color:#777;
  font-size:20px;
  cursor:pointer;
}

.bottom button:hover{
  color:#f4b62c;
}

#volume{
  width:100px;
  accent-color:#f4b62c;
}

/* FOOTER */

.footer{
  margin-top:auto;
  padding-top:30px;

  color:#555;
  font-size:12px;
  text-align:center;
}

.footer b{
  color:#8a6a25;
}

/* MOBILE */

@media(max-width:500px){

  .app{
    padding:22px 18px;
  }

  .artwork{
    width:86vw;
    max-width:390px;
    border-radius:20px;
  }

  .info,
  .progress-area,
  .controls,
  .bottom{
    width:86vw;
    max-width:390px;
  }

  .song-name{
    font-size:22px;
  }

  .controls{
    gap:22px;
  }

  .play{
    width:60px;
    height:60px;
  }

  #volume{
    width:80px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP -->

  <div class="top">

    <div class="logo">
      ♫ ঝুমুর সুর
    </div>

    <div class="online">
      <span>●</span>
      <span id="onlineCount">1</span> online
    </div>

  </div>


  <!-- ARTWORK -->

  <div class="artwork"></div>


  <!-- SONG INFO -->

  <div class="info">

    <div class="song-name" id="songName">
      ঝুমুর সুর
    </div>

    <div class="artist">
      Bengali Folk Music
    </div>

  </div>


  <!-- PROGRESS -->

  <div class="progress-area">

    <div class="time">
      <span id="current">0:00</span>
      <span id="total">0:00</span>
    </div>

    <input
      type="range"
      id="progress"
      min="0"
      max="100"
      value="0"
    >

  </div>


  <!-- CONTROLS -->

  <div class="controls">

    <button
      class="control"
      onclick="shuffle()"
      title="Shuffle"
    >
      🔀
    </button>

    <button
      class="control"
      onclick="previous()"
      title="Previous"
    >
      ⏮
    </button>

    <button
      class="play"
      id="play"
      onclick="togglePlay()"
    >
      ▶
    </button>

    <button
      class="control"
      onclick="next()"
      title="Next"
    >
      ⏭
    </button>

    <button
      class="control"
      onclick="repeat()"
      id="repeat"
      title="Repeat"
    >
      🔁
    </button>

  </div>


  <!-- BOTTOM -->

  <div class="bottom">

    <button onclick="favorite()" id="heart">
      ♡
    </button>

    <div>
      🔊
      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value=".8"
      >
    </div>

  </div>


  <!-- FOOTER -->

  <div class="footer">
    Made with ♡ for Bengali Folk Music<br>
    <b>Made by HirakMahata</b>
  </div>

</div>


<audio id="audio"></audio>


<script>

/* =========================
   YOUR SONGS
========================= */

const songs = [
  "song1.mp3",
  "song2.mp3",
  "song3.mp3",
  "song4.mp3",
  "song5.mp3",
  "song6.mp3",
  "song7.mp3",
  "song8.mp3",
  "song9.mp3",
  "song10.mp3",
  "song11.mp3",
  "song12.mp3",
  "song13.mp3",
  "song14.mp3"
];


/* =========================
   VARIABLES
========================= */

let currentSong = 0;
let repeatMode = false;

const audio =
  document.getElementById("audio");

const playButton =
  document.getElementById("play");

const songName =
  document.getElementById("songName");

const progress =
  document.getElementById("progress");

const current =
  document.getElementById("current");

const total =
  document.getElementById("total");

const volume =
  document.getElementById("volume");


/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds){

  if(!Number.isFinite(seconds)){
    return "0:00";
  }

  const min =
    Math.floor(seconds / 60);

  const sec =
    Math.floor(seconds % 60)
    .toString()
    .padStart(2,"0");

  return min + ":" + sec;
}


/* =========================
   LOAD SONG
========================= */

function loadSong(){

  audio.src =
    songs[currentSong];

  songName.textContent =
    "ঝুমুর সুর";

  progress.value = 0;

  current.textContent =
    "0:00";

  total.textContent =
    "0:00";

  audio.load();
}


/* =========================
   PLAY
========================= */

function playSong(){

  audio.play()
    .then(function(){

      playButton.textContent =
        "❚❚";

    })
    .catch(function(){

      songName.textContent =
        "Play চাপুন";

    });
}


/* =========================
   PAUSE
========================= */

function pauseSong(){

  audio.pause();

  playButton.textContent =
    "▶";
}


/* =========================
   TOGGLE
========================= */

function togglePlay(){

  if(audio.paused){

    playSong();

  }else{

    pauseSong();

  }
}


/* =========================
   NEXT
========================= */

function next(){

  currentSong++;

  if(currentSong >= songs.length){
    currentSong = 0;
  }

  loadSong();
  playSong();
}


/* =========================
   PREVIOUS
========================= */

function previous(){

  currentSong--;

  if(currentSong < 0){
    currentSong = songs.length - 1;
  }

  loadSong();
  playSong();
}


/* =========================
   SHUFFLE
========================= */

function shuffle(){

  let random;

  do{

    random =
      Math.floor(
        Math.random() * songs.length
      );

  }while(
    random === currentSong &&
    songs.length > 1
  );

  currentSong = random;

  loadSong();
  playSong();
}


/* =========================
   REPEAT
========================= */

function repeat(){

  repeatMode = !repeatMode;

  const button =
    document.getElementById("repeat");

  button.style.color =
    repeatMode
      ? "#f4b62c"
      : "#ddd";
}


/* =========================
   FAVORITE
========================= */

function favorite(){

  const heart =
    document.getElementById("heart");

  if(heart.textContent === "♡"){

    heart.textContent = "♥";
    heart.style.color = "#f4b62c";

  }else{

    heart.textContent = "♡";
    heart.style.color = "#777";

  }
}


/* =========================
   SONG END
========================= */

audio.addEventListener(
  "ended",
  function(){

    if(repeatMode){

      audio.currentTime = 0;

      playSong();

    }else{

      next();

    }

  }
);


/* =========================
   METADATA
========================= */

audio.addEventListener(
  "loadedmetadata",
  function(){

    total.textContent =
      formatTime(audio.duration);

  }
);


/* =========================
   PROGRESS
========================= */

audio.addEventListener(
  "timeupdate",
  function(){

    if(audio.duration){

      progress.value =
        (audio.currentTime /
        audio.duration) * 100;

    }

    current.textContent =
      formatTime(audio.currentTime);

  }
);


/* =========================
   SEEK
========================= */

progress.addEventListener(
  "input",
  function(){

    if(audio.duration){

      audio.currentTime =
        (progress.value / 100) *
        audio.duration;

    }

  }
);


/* =========================
   VOLUME
========================= */

volume.addEventListener(
  "input",
  function(){

    audio.volume =
      volume.value;

  }
);


/* =========================
   ONLINE DEMO
========================= */

let online =
  Math.floor(Math.random() * 8) + 3;

document.getElementById(
  "onlineCount"
).textContent = online;


/* =========================
   START
========================= */

audio.volume = .8;

loadSong();

</script>

</body>
</html>
