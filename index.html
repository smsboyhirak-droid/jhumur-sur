<html lang="bn">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ঝুমুর সুর</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#070707;
  color:#fff;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  overflow-x:hidden;
}

/* ================= HEADER ================= */

header{
  height:72px;
  background:#090909;
  border-bottom:1px solid #333;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:100;
}

.logo{
  color:#f5b62a;
  font-size:25px;
  font-weight:bold;
}

.logo span{
  display:block;
  color:#ddd;
  font-size:12px;
  font-weight:normal;
  margin-top:3px;
}

.nav{
  display:flex;
  gap:24px;
  color:#eee;
  font-size:14px;
}

.nav div{
  cursor:pointer;
}

/* ================= HOME ================= */

.home{
  min-height:100vh;
  padding-top:72px;
  padding-bottom:180px;

  background:
    linear-gradient(
      rgba(0,0,0,.25),
      rgba(0,0,0,.70)
    ),
    linear-gradient(
      120deg,
      #151515,
      #4a170c 45%,
      #090909
    );
}

/* ================= HERO ================= */

.hero{
  min-height:75vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 20px;
}

.hero-content{
  max-width:750px;
}

.hero-small{
  color:#f3ad25;
  font-size:15px;
  letter-spacing:3px;
  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(55px,13vw,125px);
  line-height:.95;
  font-weight:900;
  letter-spacing:-4px;

  color:white;

  text-shadow:
    0 5px 20px rgba(0,0,0,.8);
}

.hero h1 span{
  color:#f3ad25;
}

.hero p{
  margin-top:25px;
  color:#ddd;
  font-size:18px;
}

.line{
  width:130px;
  height:2px;
  background:#e5a522;
  margin:25px auto;
}

/* ================= PLAYER AREA ================= */

.player-space{
  padding:0 20px;
  display:flex;
  justify-content:center;
}

.player{
  width:100%;
  max-width:850px;
  min-height:130px;

  background:
    linear-gradient(
      135deg,
      rgba(80,45,20,.95),
      rgba(35,25,20,.96)
    );

  border:1px solid #a36b18;
  border-radius:25px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.65);

  padding:20px;

  display:flex;
  align-items:center;
  gap:20px;
}

/* album */

.album{
  width:88px;
  height:88px;
  flex-shrink:0;

  border-radius:18px;

  background:
    radial-gradient(
      circle at center,
      #f3ad25 0,
      #7c4410 35%,
      #17110d 70%
    );

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:35px;
}

/* info */

.info{
  flex:1;
  min-width:0;
}

.song-title{
  font-size:18px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist{
  color:#bbb;
  font-size:14px;
  margin-top:7px;
}

.progress-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:15px;
}

.time{
  font-size:11px;
  color:#ccc;
  width:38px;
}

.progress{
  flex:1;
  height:5px;
  appearance:none;
  background:#5b514b;
  border-radius:10px;
  cursor:pointer;
}

.progress::-webkit-slider-thumb{
  appearance:none;
  width:14px;
  height:14px;
  background:#f3ad25;
  border-radius:50%;
}

/* controls */

.controls{
  display:flex;
  align-items:center;
  gap:13px;
}

.btn{
  border:0;
  background:transparent;
  color:white;
  font-size:23px;
  cursor:pointer;
}

.play{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#f3ad25;
  color:#111;
  font-size:25px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.play:hover{
  transform:scale(1.05);
}

/* volume */

.volume{
  width:90px;
  appearance:none;
  height:4px;
  background:#6a5b4e;
  border-radius:10px;
}

.volume::-webkit-slider-thumb{
  appearance:none;
  width:13px;
  height:13px;
  background:#f3ad25;
  border-radius:50%;
}

/* ================= FOOTER ================= */

footer{
  text-align:center;
  color:#888;
  padding:35px 15px;
  font-size:13px;
}

footer span{
  color:#f3ad25;
}

/* ================= YOUTUBE PLAYER ================= */

/*
  YouTube player পুরোপুরি স্ক্রিনের বাইরে রাখা হয়েছে।
  তাই কোনো ভিডিও দেখা যাবে না।
*/

#youtubePlayer{
  position:fixed;
  width:1px;
  height:1px;
  left:-10px;
  bottom:-10px;
  opacity:0;
  pointer-events:none;
}

/* ================= MOBILE ================= */

@media(max-width:650px){

  header{
    height:65px;
    padding:0 15px;
  }

    font-size:20px;
  }

  .nav{
    gap:12px;
    font-size:12px;

  }

  }

  .hero p{
    font-size:15px;
  }

  .player{
    border-radius:22px;
    padding:15px;
    gap:12px;
  }

  .album{
    width:65px;
    height:65px;
    font-size:25px;
    border-radius:14px;
  }

  .song-title{
    font-size:15px;
  }

  .artist{
    font-size:12px;
  }

  .controls{
    gap:8px;
  }

  .btn{
    font-size:19px;
  }

  .play{
    width:50px;
    height:50px;
  }

  .volume{
    display:none;
  }
}

          id="volume"
          min="0"
          max="1"
          step="0.01"
          value="1"

      </div>

/* =====================================================
   VARIABLES
   ===================================================== */

let currentSong = 0;
let playing = false;
let youtubeReady = false;
let youtubePlayer;


/* =====================================================
   HTML ELEMENTS
   ===================================================== */

const audio = document.getElementById("audio");

const playButton =
  document.getElementById("playButton");

const songTitle =
  document.getElementById("songTitle");

const artist =
  document.getElementById("artist");

const progress =
  document.getElementById("progress");

const currentTime =
  document.getElementById("currentTime");

const duration =
  document.getElementById("duration");

const volume =
  document.getElementById("volume");


/* =====================================================
   YOUTUBE API
   ===================================================== */

function onYouTubeIframeAPIReady(){

  youtubePlayer =
    new YT.Player("youtubePlayer", {

      height:"1",
      width:"1",

      videoId:"82cTuqdbafk",

      playerVars:{
        controls:0,
        playsinline:1,
        rel:0,
        modestbranding:1
      },

      events:{
        onReady:function(){
          youtubeReady = true;
          loadSong(0);
        },

        onStateChange:function(event){

          if(event.data === YT.PlayerState.PLAYING){

            playing = true;
            playButton.innerText = "❚❚";

          }

          if(event.data === YT.PlayerState.PAUSED){

            playing = false;
            playButton.innerText = "▶";

          }

          if(event.data === YT.PlayerState.ENDED){

            nextSong();

          }

        }

      }

    });

}


/* =====================================================
   LOAD SONG
   ===================================================== */

function loadSong(index){

  currentSong = index;

  const song = songs[currentSong];

  songTitle.innerText = song.title;

  artist.innerText = song.artist;

  progress.value = 0;

  currentTime.innerText = "00:00";

  duration.innerText = "00:00";


  /* STOP EVERYTHING */

  audio.pause();

  if(youtubeReady){

    try{
      youtubePlayer.stopVideo();
    }catch(e){}

  }

  playing = false;

  playButton.innerText = "▶";


  /* LOCAL MP3 */

  if(song.type === "local"){

    audio.src = song.src;

    audio.volume = volume.value;

    audio.load();

  }


  /* YOUTUBE */

  if(song.type === "youtube"){

    if(youtubeReady){

      youtubePlayer.cueVideoById(song.id);

    }

  }

}


/* =====================================================
   PLAY / PAUSE
   ===================================================== */

function togglePlay(){

  const song = songs[currentSong];


  /* LOCAL */

  if(song.type === "local"){

    if(!playing){

      audio.play()
      .then(()=>{

        playing = true;
        playButton.innerText = "❚❚";

      })
      .catch(()=>{

        alert(
          "গানটি চালু হচ্ছে না। song ফাইলটি GitHub-এ আছে কিনা দেখুন।"
        );

      });

    }else{

      audio.pause();

      playing = false;

      playButton.innerText = "▶";

    }

  }


  /* YOUTUBE */

  else{

    if(!youtubeReady){

      alert("YouTube player এখনও প্রস্তুত হচ্ছে। একটু অপেক্ষা করুন।");

      return;

    }

    if(!playing){

      youtubePlayer.playVideo();

      playing = true;

      playButton.innerText = "❚❚";

    }else{

      youtubePlayer.pauseVideo();

      playing = false;

      playButton.innerText = "▶";

    }

  }

}


/* =====================================================
   NEXT
   ===================================================== */

function nextSong(){

  currentSong++;

  if(currentSong >= songs.length){

    currentSong = 0;

  }

  loadSong(currentSong);

  setTimeout(()=>{

    togglePlay();

  },300);

}


/* =====================================================
   PREVIOUS
   ===================================================== */

function previousSong(){

  currentSong--;

  if(currentSong < 0){

    currentSong = songs.length - 1;

  }

  loadSong(currentSong);

  setTimeout(()=>{

    togglePlay();

  },300);

}


/* =====================================================
   LOCAL AUDIO EVENTS
   ===================================================== */

audio.addEventListener(
  "loadedmetadata",
  ()=>{

    duration.innerText =
      formatTime(audio.duration);

  }
);


audio.addEventListener(
  "timeupdate",
  ()=>{

    if(audio.duration){

      progress.value =
        (audio.currentTime / audio.duration) * 100;

      currentTime.innerText =
        formatTime(audio.currentTime);

    }

  }
);


audio.addEventListener(
  "play",
  ()=>{

    playing = true;
    playButton.innerText = "❚❚";

  }
);


audio.addEventListener(
  "pause",
  ()=>{

    playing = false;
    playButton.innerText = "▶";

  }
);


audio.addEventListener(
  "ended",
  ()=>{

    nextSong();

  }
);


/* =====================================================
   PROGRESS BAR
   ===================================================== */

progress.addEventListener(
  "input",
  ()=>{

    const song = songs[currentSong];

    const percent =
      progress.value / 100;


    /* LOCAL */

    if(song.type === "local"){

      if(audio.duration){

        audio.currentTime =
          audio.duration * percent;

      }

    }


    /* YOUTUBE */

    else{

      if(youtubeReady){

        const total =
          youtubePlayer.getDuration();

        youtubePlayer.seekTo(
          total * percent,
          true
        );

      }

    }

  }
);


/* =====================================================
   VOLUME
   ===================================================== */

volume.addEventListener(
  "input",
  ()=>{

    audio.volume = volume.value;

    if(youtubeReady){

      youtubePlayer.setVolume(
        Number(volume.value) * 100
      );

    }

  }
);


/* =====================================================
   YOUTUBE PROGRESS
   ===================================================== */

setInterval(()=>{

  if(!youtubeReady) return;

  const song = songs[currentSong];

  if(song.type !== "youtube") return;

  if(!playing) return;


  const current =
    youtubePlayer.getCurrentTime();

  const total =
    youtubePlayer.getDuration();


  if(total > 0){

    progress.value =
      (current / total) * 100;

    currentTime.innerText =
      formatTime(current);

    duration.innerText =
      formatTime(total);

  }

},500);


/* =====================================================
   TIME FORMAT
   ===================================================== */

function formatTime(seconds){

  if(!seconds || isNaN(seconds)){

    return "00:00";

  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60)
    .toString()
    .padStart(2,"0");

  return minutes + ":" + secs;

}


/* =====================================================
   START
   ===================================================== */

loadSong(0);
