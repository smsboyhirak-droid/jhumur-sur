<!DOCTYPE html>
<html lang="bn">

<meta charset="UTF-8">

<title>ঝুমুর সুর</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#080808;
  color:#fff;
  padding-bottom:40px;
}

/* HEADER */

header{
  background:#0b0b0b;
  border-bottom:1px solid #4a3512;
  padding:15px 20px;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#f4ae22;
  font-size:27px;
  font-weight:bold;
}

.tagline{
  color:#999;
  font-size:12px;
  margin-top:4px;
}

.menu{
  display:flex;
  gap:20px;
}

.menu a{
  color:#ddd;
  text-decoration:none;
  font-size:14px;
}

.menu a:hover{
  color:#f4ae22;
}


/* EMPTY PHOTO AREA */

.hero{
  max-width:1100px;
  margin:auto;
  min-height:470px;

  display:flex;
  align-items:center;

  padding:60px 30px;

  background:#080808;

  border-bottom:2px solid #d79b22;
}

.hero-content{
  max-width:600px;
}

.small{
  color:#f4ae22;
  letter-spacing:3px;
  font-size:13px;
}

.hero h1{
  font-size:65px;
  margin:15px 0;
}

.hero p{
  color:#ddd;
  font-size:20px;
  line-height:1.6;
}

.play-main{
  margin-top:25px;
  padding:14px 28px;

  border:0;
  border-radius:30px;

  background:#f4ae22;
  color:#111;

  font-size:17px;
  font-weight:bold;

  cursor:pointer;
}


/* CONTENT */

.container{
  max-width:950px;
  margin:auto;
  padding:30px 18px;
}

.heading{
  color:#f4ae22;
  font-size:25px;
  margin-bottom:18px;
}


/* SONG LIST */

.song-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.song{
  background:#151515;
  border:1px solid #33260f;
  border-radius:14px;

  padding:13px 15px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  cursor:pointer;
  transition:.2s;
}

.song:hover{
  border-color:#f4ae22;
  background:#19160f;
}

.song.active{
  border-color:#f4ae22;
  background:#1d180e;
}

.song-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.number{
  width:42px;
  height:42px;

  border-radius:50%;

  background:#211a0d;
  color:#f4ae22;

  display:flex;
  justify-content:center;
  align-items:center;

  font-weight:bold;
  flex-shrink:0;
}

.title{
  font-size:16px;
}

.artist{
  color:#888;
  font-size:12px;
  margin-top:4px;
}

.play-icon{
  color:#f4ae22;
  font-size:23px;
}


/* PLAYER */

.player-box{
  margin-top:30px;

  background:#101010;

  border:1px solid #c38d21;
  border-radius:18px;

  padding:15px;
}

.player-title{
  color:#f4ae22;
  font-size:18px;
  margin-bottom:13px;
}

.youtube{
  width:100%;
  aspect-ratio:16/9;

  border:0;
  border-radius:12px;

  background:#000;

  display:none;
}

.audio-player{
  width:100%;
  display:none;
}


/* FOOTER */

footer{
  text-align:center;
  color:#777;

  border-top:1px solid #30240e;

  margin-top:50px;
  padding:30px 15px;

  font-size:13px;
}

footer b{
  color:#f4ae22;
}


/* MOBILE */

@media(max-width:650px){

  .nav{
    align-items:flex-start;
  }

  .logo{
    font-size:22px;
  }

  .menu{
    gap:10px;
  }

  .menu a{
    font-size:11px;
  }

  .hero{
    min-height:400px;
    padding:45px 20px;
  }

  .hero h1{
    font-size:45px;
  }

  .hero p{
    font-size:17px;
  }

  .container{
    padding:25px 12px;
  }

  .song{
    padding:11px;
  }

}
</style>
</head>

  <button

</div>

</section>

    id="playerTitle">

  </div>


  <!-- MP3 PLAYER -->

  <audio

  <!-- YOUTUBE PLAYER -->

  <iframe
    id="youtubePlayer"

    title="Jhumur Sur YouTube Player"
    allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen>

</div>


</main>



<!-- FOOTER -->

<footer>

  Made with ❤️ for Bengali Folk Music

/*
==================================================
ELEMENTS
==================================================
*/

const songList =
document.getElementById("songList");

const audioPlayer =
document.getElementById("audioPlayer");

const youtubePlayer =
document.getElementById("youtubePlayer");

const playerTitle =
document.getElementById("playerTitle");



/*
==================================================
CREATE SONG LIST
==================================================
*/

songs.forEach((song,index)=>{

  const item =
  document.createElement("div");

  item.className = "song";

  item.innerHTML = `

    <div class="song-left">

      <div class="number">
        ${index + 1}
      </div>

      <div>

        <div class="title">
          ${song.title}
        </div>

        <div class="artist">
          ${song.artist}
        </div>

      </div>

    </div>

    <div class="play-icon">
      ▶
    </div>

  `;


  item.onclick =
  function(){

    playSong(index);

  };


  songList.appendChild(item);

});



/*
==================================================
PLAY SONG
==================================================
*/

function playSong(index){

  const song =
  songs[index];


  playerTitle.innerText =
  "🎵 " + song.title;


  /*
  MP3
  */

  if(song.type === "mp3"){

    youtubePlayer.style.display =
    "none";

    youtubePlayer.src = "";


    audioPlayer.style.display =
    "block";


    audioPlayer.src =
    song.file;


    audioPlayer.play()
    .catch(()=>{});

  }


  /*
  YOUTUBE
  */

  else{

    audioPlayer.pause();

    audioPlayer.src = "";

    audioPlayer.style.display =
    "none";


    youtubePlayer.style.display =
    "block";


    youtubePlayer.src =
      "https://www.youtube.com/embed/"
      + song.youtubeId
      + "?autoplay=1&rel=0";

  }

}



/*
==================================================
FIRST SONG
==================================================
*/

function playFirstSong(){

  playSong(0);


  document
  .getElementById("songs")
  .scrollIntoView({
    behavior:"smooth"
  });

}
